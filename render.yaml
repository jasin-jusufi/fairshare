# Render Blueprint: PostgreSQL + web service from the released GHCR image (ADR-006).
# Deploys are triggered by the manual CD workflow (deploy hook), not by Render itself.
databases:
  - name: fairshare-db
    plan: free
    databaseName: fairshare
    user: fairshare

services:
  - type: web
    name: fairshare
    runtime: image
    image:
      url: ghcr.io/jasin-jusufi/fairshare:latest
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fairshare-db
          property: connectionString
      - key: RECEIPT_PARSER
        value: none
