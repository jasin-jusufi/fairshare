name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required AI-SDLC artefacts
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PROJECT.md
          test -f docs/TASKS.md
          test -f docs/specs/UC-TEMPLATE.md
          test -f .github/copilot-instructions.md
          test -d skills
          test -d docs/adr
          test -d .devcontainer

      - name: Check whitespace errors
        run: git diff --check

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy --strict)
        run: mypy

      - name: Architecture rules (import-linter)
        env:
          PYTHONPATH: src
        run: lint-imports

      - name: Migrations match ORM models (alembic)
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic upgrade head && alembic check

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit and integration tests with coverage gate
        run: pytest tests/unit tests/integration --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  e2e:
    needs: [quality, test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fairshare
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Build Docker image
        run: docker build -t fairshare:ci .

      - name: Run container against PostgreSQL
        run: |
          docker run -d --name fairshare-e2e --network host \
            -e PORT=8001 \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/fairshare \
            fairshare:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && exit 0
            sleep 1
          done
          docker logs fairshare-e2e
          exit 1

      - name: E2E tests against container (API + browser UI)
        env:
          BASE_URL: http://127.0.0.1:8001
        run: pytest tests/e2e --tracing retain-on-failure --output test-results

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results

      - name: Container logs
        if: always()
        run: docker logs fairshare-e2e || true
