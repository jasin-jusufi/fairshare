name: CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (e.g. v0.1.0 or latest)
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
        run: |
          if [ "$CD_ENABLED" != "true" ]; then
            echo "::error::Set repository variable CD_ENABLED=true after configuring Render (see README)."
            exit 1
          fi

      - name: Deploy image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
        run: ./scripts/deploy.sh

      - name: Post-deployment smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: ./scripts/smoke-test.sh
