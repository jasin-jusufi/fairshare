name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit and integration tests
        run: pytest tests/unit tests/integration --cov

      - name: Build Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build \
            --build-arg PYTHON_VERSION="$(cat .python-version)" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="${GITHUB_REF_NAME}" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:latest" .

      - name: Run container for E2E
        run: |
          docker run -d --name fairshare-e2e -p 8001:8000 "${IMAGE}:${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && exit 0
            sleep 1
          done
          docker logs fairshare-e2e
          exit 1

      - name: E2E tests against container
        env:
          BASE_URL: http://127.0.0.1:8001
        run: pytest tests/e2e

      - name: Cleanup container
        if: always()
        run: docker rm -f fairshare-e2e || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
